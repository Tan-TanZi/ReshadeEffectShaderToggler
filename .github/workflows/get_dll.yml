name: get_dll
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  SOLUTION_PATH: src/ReshadeEffectShaderToggler.sln
  CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # 1. 先单独构建 libMinHook 依赖库
      - name: Build libMinHook (x64)
        run: |
          msbuild deps/libMinHook/libMinHook.vcxproj /m /p:Platform=x64 /p:Configuration=${{ env.CONFIGURATION }}

      # 2. 将生成的 .lib 文件复制到主项目期望的位置
      - name: Copy libMinHook.lib to expected path
        run: |
          $source = "deps\libMinHook\bin\x64\Release\libMinHook.lib"
          $destDir = "deps\libMinHook\x64\Release"
          if (Test-Path $source) {
            New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            Copy-Item -Path $source -Destination $destDir -Force
            Write-Host "Successfully copied libMinHook.lib to $destDir"
          } else {
            Write-Error "libMinHook.lib not found at $source"
            exit 1
          }

      # 3. 构建主项目（此时链接器可以找到 libMinHook.lib）
      - name: Build main project (x64)
        run: |
          msbuild ${{ env.SOLUTION_PATH }} /m /p:Platform=x64 /p:Configuration=${{ env.CONFIGURATION }}

      # 4. 查找生成的 .addon64 文件（主项目直接输出 .addon64）
      - name: Locate and prepare addon file
        run: |
          $addon = Get-ChildItem -Path . -Recurse -Filter "*.addon64" | Select-Object -First 1
          if (-not $addon) {
            Write-Error "No .addon64 file found after build!"
            exit 1
          }
          Copy-Item $addon.FullName -Destination "ReshadeEffectShaderToggler.addon64" -Force
          Write-Host "Prepared addon: ReshadeEffectShaderToggler.addon64"

      # 5. 上传最终产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReShadeAddon
          path: ReshadeEffectShaderToggler.addon64
          if-no-files-found: error
